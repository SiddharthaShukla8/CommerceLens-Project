services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commercelens
      POSTGRES_USER: commercelens
      POSTGRES_PASSWORD: commercelens
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/indexes.sql:/docker-entrypoint-initdb.d/02-indexes.sql:ro
      - ./database/views.sql:/docker-entrypoint-initdb.d/03-views.sql:ro
volumes:
  postgres_data:
